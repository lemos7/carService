log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;
server_tokens off;
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;
  access_log /var/log/nginx/access.log safe;
  error_log /var/log/nginx/error.log crit;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location ^~ /internal/ { return 404; }
  location ~* ^/api/auth/(login|register|forgot-password|reset-password)/?$ {
    client_max_body_size 16k;
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://identity-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
  }
  location /api/auth/ { proxy_pass http://identity-api:8080/api/auth/; proxy_set_header Host $host; }
  location /api/vehicles/ { proxy_pass http://vehicles-api:8080/api/vehicles/; proxy_set_header Host $host; }
  location /api/maintenance/ { proxy_pass http://maintenance-api:8080/api/maintenance/; proxy_set_header Host $host; }
  location /uploads/ { proxy_pass http://vehicles-api:8080/uploads/; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}

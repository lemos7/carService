<label class="block">
  <span class="mb-1.5 block text-sm font-medium text-gray-800">
    {{ label() }}
    <span *ngIf="required()" aria-hidden="true">*</span>
  </span>
  <input
    [attr.type]="inputType()"
    [attr.placeholder]="placeholder()"
    [attr.required]="required()"
    [value]="value"
    (input)="change($event)"
    (blur)="touched()"
    class="block min-h-11 w-full rounded-lg border border-gray-400 bg-white p-2.5 text-gray-900 focus:border-brand focus:ring-brand"
  />
  <span *ngIf="hint()" class="mt-1 block text-xs text-gray-600">{{ hint() }}</span>
</label>

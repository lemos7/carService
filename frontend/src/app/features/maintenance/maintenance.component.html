<section>
  <div class="flex items-end justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold">Alertas de manutenção</h1>
      <p class="mt-1 text-gray-600">Planeje serviços e receba alertas por quilometragem.</p>
    </div>
    <a
      routerLink="/manutencoes/nova"
      class="inline-flex min-h-11 items-center rounded-lg bg-brand px-4 py-2.5 font-semibold"
    >
      Novo alerta
    </a>
  </div>
  <app-alert
    *ngIf="message"
    class="mt-4 block"
    [type]="error ? 'error' : 'success'"
    [title]="error ? 'Erro' : 'Concluído'"
  >
    {{ message }}
  </app-alert>
  <div class="mt-5 space-y-3">
    <article
      *ngFor="let item of items"
      class="rounded-xl bg-white p-5 shadow-sm"
      [class.opacity-60]="item.completedAtUtc"
    >
      <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="font-bold">{{ item.title }}</h2>
            <span
              *ngIf="item.completedAtUtc"
              class="rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-success"
            >
              Concluída
            </span>
          </div>
          <p class="mt-1 text-sm text-gray-600">
            {{ vehicleName(item.vehicleId) }} · prevista para {{ item.dueKm | number }} km
          </p>
          <p *ngIf="item.notes" class="mt-2 text-sm">{{ item.notes }}</p>
        </div>
        <button
          *ngIf="!item.completedAtUtc"
          type="button"
          (click)="complete(item.id)"
          [disabled]="completingIds.has(item.id)"
          class="min-h-11 rounded-lg border-2 border-success px-4 py-2 text-sm font-semibold text-success hover:bg-green-50 disabled:cursor-not-allowed disabled:border-gray-400 disabled:text-gray-500 disabled:opacity-70"
        >
          {{ completingIds.has(item.id) ? 'Concluindo...' : 'Confirmar manutenção' }}
        </button>
      </div>
    </article>
    <p *ngIf="!items.length" class="rounded-xl bg-white p-5 text-gray-600 shadow-sm">
      Nenhuma manutenção cadastrada.
    </p>
  </div>
</section>

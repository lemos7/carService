# Always combine explicitly with docker-compose.yml; never load the local override.
x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  FrontendUrl: http://localhost:${E2E_PORT:-4300}
x-api-health: &api-health
  test:
    - CMD
    - bash
    - -ec
    - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]'
  interval: 2s
  timeout: 5s
  retries: 60
  start_period: 10s
services:
  identity-api:
    environment: *api-environment
    healthcheck: *api-health
  vehicles-api:
    environment: *api-environment
    healthcheck: *api-health
  maintenance-api:
    environment: *api-environment
    healthcheck: *api-health
  web:
    ports: ['127.0.0.1:${E2E_PORT:-4300}:80']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/login']
      interval: 2s
      timeout: 5s
      retries: 30

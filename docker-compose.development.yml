# Local development exposes APIs on loopback for the Angular dev server.
services:
  identity-api:
    ports: ["127.0.0.1:7001:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FrontendUrl: http://localhost:4200
  vehicles-api:
    networks: [backend, outbound]
    ports: ["127.0.0.1:7002:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FrontendUrl: http://localhost:4200
  maintenance-api:
    networks: [backend, outbound]
    ports: ["127.0.0.1:7003:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FrontendUrl: http://localhost:4200
  web:
    ports: ["127.0.0.1:4200:80"]
